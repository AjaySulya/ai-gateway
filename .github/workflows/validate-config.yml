name: Validate GitOps Config

on:
  push:
    paths:
      - "config/**"
  pull_request:
    paths:
      - "config/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Validate all config files
        run: |
          for f in config/**/*.yaml; do
            echo "Validating $f"
            uv run python -m gateway.gitops.cli validate --config "$f"
          done
